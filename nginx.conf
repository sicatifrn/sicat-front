server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas de API para o backend (app CapRover "sicat-web")
    location /api/ {
        proxy_pass http://srv-captain--sicat-web:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Arquivos servidos pelo backend (PDFs e imagens das fichas)
    location /public/ {
        proxy_pass http://srv-captain--sicat-web:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
